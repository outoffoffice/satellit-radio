# ALSA-Konfiguration für den Google AIY Voice HAT (v1)
# Lautsprecher mit Software-Lautstärke ("Master"), Mikrofon mit Verstärkung.

pcm.softvol {
    type softvol
    slave.pcm "dmix:CARD=sndrpigooglevoi"
    control {
        name "Master"
        card sndrpigooglevoi
    }
}

pcm.micboost {
    type route
    slave.pcm "dsnoop:CARD=sndrpigooglevoi"
    ttable {
        0.0 30.0
        1.1 30.0
    }
}

pcm.!default {
    type asym
    playback.pcm "plug:softvol"
    capture.pcm "plug:micboost"
}

ctl.!default {
    type hw
    card sndrpigooglevoi
}
